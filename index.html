<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Brain Explorer</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='11' cy='13' r='7.5' fill='none' stroke='%23d36bff' stroke-width='1.4'/%3E%3Ccircle cx='20' cy='13' r='7.5' fill='none' stroke='%236f86ff' stroke-width='1.4'/%3E%3Ccircle cx='18' cy='23' r='4.5' fill='none' stroke='%23f5b83d' stroke-width='1.4'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700&family=Spectral:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <!--
    THESIS: The brain as a luminous specimen you study at four magnifications. Refuses the static textbook plate with numbered callouts.
    OWN-WORLD: Holographic point-cloud anatomy on blue-black; each structure owns a hue that tints the whole explainer when chosen. Bricolage Grotesque for names and controls, Spectral for reading.
    STORY: A beginner picks a part, sees it light up inside the brain, reads what it does, then zooms down the ladder to wiring and cells.
    FIRST VIEWPORT: Left 288px index of parts and pathways; centre, a slowly turning glowing brain filling the stage; right 460px explainer with the zoom ladder.
    FORM: User-pinned (reference image: glowing wireframe brain). No seed roll.
    FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, DESIGN.md, and every shipping raster carrying its provenance
  -->
  <div class="app mode-parts">
    <header class="topbar">
      <a class="brand" href="#/">
        <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
          <circle cx="11" cy="13" r="7.5" fill="none" stroke="#d36bff" stroke-width="1.4" />
          <circle cx="20" cy="13" r="7.5" fill="none" stroke="#6f86ff" stroke-width="1.4" />
          <circle cx="18" cy="23" r="4.5" fill="none" stroke="#f5b83d" stroke-width="1.4" />
        </svg>
        <span class="brand-name">Brain Explorer</span>
      </a>
      <nav class="modes" aria-label="Sections">
        <a data-mode="parts" href="#/">Atlas</a>
        <a data-mode="pathways" href="#/pathways">Pathways</a>
        <a data-mode="ask" href="#/ask">Ask</a>
      </nav>
    </header>

    <aside class="sidebar">
      <div class="dict-tabs" role="tablist">
        <a data-dict="parts" class="is-on" aria-selected="true" href="#/">Parts</a>
        <a data-dict="chem" href="#/chem">Chemicals</a>
        <a data-dict="cell" href="#/cell">Cells</a>
      </div>
      <label class="search">
        <span id="search-icon"></span>
        <input id="search" type="search" placeholder="Search parts of the brain" autocomplete="off" />
      </label>
      <nav id="list" class="list"></nav>
    </aside>

    <main class="stage">
      <canvas id="brain"></canvas>
      <div id="labels" class="labels"></div>
      <div id="hover-label" class="hover-label"></div>
      <div id="toolbar" class="toolbar"></div>
      <a id="cell-inset" class="cell-inset" hidden href="" title="Where this cell lives"></a>
      <p class="stage-note">Shapes are simplified for explanation, not an anatomical atlas.</p>
      <div id="lens-legend" class="lens-legend" hidden>
        <span class="legend-item"><i class="legend-dot is-bright"></i> Bright = where it is made</span>
        <span class="legend-item"><i class="legend-dot is-fibres"></i> Fibres = where it is sent</span>
        <span class="legend-item"><i class="legend-dot is-glow"></i> Glow = receptors, brighter means more</span>
        <span class="legend-sub">Cut down the middle. The same fibres run in the other half.</span>
      </div>
      <div id="library" class="library" hidden></div>
    </main>

    <section id="explainer" class="explainer"></section>
  </div>
  <div id="tip" class="tip" role="tooltip"></div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
